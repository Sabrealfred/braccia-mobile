name: Build Android APK

# Builds the Braccia Capital mobile app (flutter_app/) into an installable APK.
# GitHub-hosted runners ship with the Android SDK, so this produces a real,
# downloadable .apk artifact on every push / on demand — no local Android SDK needed.

on:
  push:
    branches:
      - claude/beautiful-mayer-ip4fj6
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'flutter_app/**'
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'APK build mode'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Run tests
        run: flutter test
        continue-on-error: true

      - name: Build APK (${{ github.event.inputs.build_mode || 'release' }})
        run: flutter build apk --${{ github.event.inputs.build_mode || 'release' }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: braccia-mobile-apk
          path: flutter_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
          retention-days: 30
