name: braccia_mobile
description: "Braccia Capital — native mobile CRM (Onyx & Gold). Full feature parity with the web staff portal, over the same Supabase backend."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Backend — same Supabase project/schema as the web staff portal
  supabase_flutter: ^2.8.4

  # Routing (deep-linkable, parity with web URLs)
  go_router: ^14.6.2

  # Typography — DM Serif Display + DM Sans
  google_fonts: ^6.2.1

  # Formatting
  intl: ^0.20.2

  # Biometric (fingerprint / face) unlock
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
